<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controlled Website Audit Fixture</title>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: #14213d; background: #f8fafc; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; }
    .card { padding: 28px; border: 1px solid #dbe3ef; border-radius: 20px; background: white; }
    .links { display: flex; gap: 12px; margin: 20px 0; }
    a, button { padding: 11px 15px; border: 0; border-radius: 10px; color: white; background: #315be8; font: inherit; cursor: pointer; }
    form { display: grid; gap: 10px; margin-top: 22px; }
    input, textarea { padding: 10px; border: 1px solid #ccd5e2; border-radius: 8px; font: inherit; }
    #chat { position: fixed; right: 24px; bottom: 80px; width: 330px; padding: 16px; border: 1px solid #dbe3ef; border-radius: 16px; background: white; box-shadow: 0 18px 50px rgba(20, 33, 61, .2); }
    #chat[hidden] { display: none; }
    #messages { display: grid; gap: 8px; max-height: 220px; overflow: auto; margin-bottom: 12px; }
    [data-audit-chat-message] { padding: 8px 10px; border-radius: 10px; background: #eef3ff; }
    [data-audit-chat-message][data-side="business"] { background: #eaf8f1; }
    [data-audit-chat-composer] { width: 100%; }
    [data-audit-chat-launcher] { position: fixed; right: 24px; bottom: 24px; background: #101a2f; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Engbrain AI Workshops</h1>
      <p>Practical workshops for business owners building with AI.</p>
      <div class="links">
        <a href="tel:+15550100">Call us</a>
        <a href="mailto:events@example.com">Email events</a>
        <a href="/book-workshop">Book a workshop</a>
        <a href="/contact">Contact</a>
      </div>
      <form id="contact-form" action="/fixture-form-submit" method="post">
        <strong>Contact form</strong>
        <input name="name" aria-label="Name">
        <input name="email" type="email" aria-label="Email">
        <textarea name="question" aria-label="Question"></textarea>
        <button type="submit">Send contact form</button>
      </form>
    </section>
  </main>

  <button type="button" data-audit-chat-launcher aria-label="Chat with us">Chat with us</button>
  <section id="chat" hidden aria-label="Website chat">
    <div id="messages" role="log" aria-live="polite">
      <div data-audit-chat-message data-audit-message-id="welcome" data-side="business">Hi! How can we help?</div>
    </div>
    <input data-audit-chat-composer aria-label="Type a message" placeholder="Type a message">
  </section>

  <script>
    const chat = document.querySelector('#chat');
    const messages = document.querySelector('#messages');
    const composer = document.querySelector('[data-audit-chat-composer]');
    let sequence = 0;
    document.querySelector('[data-audit-chat-launcher]').addEventListener('click', () => {
      chat.hidden = false;
      composer.focus();
    });
    composer.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || !composer.value.trim()) return;
      event.preventDefault();
      const text = composer.value.trim();
      composer.value = '';
      const own = document.createElement('div');
      own.dataset.auditChatMessage = '';
      own.dataset.auditMessageId = `buyer-${++sequence}`;
      own.dataset.side = 'buyer';
      own.textContent = text;
      messages.append(own);
      fetch('/fixture-send', { method: 'POST' });
      if (/authorized customer-response audit/i.test(text)) return;
      setTimeout(() => {
        const reply = document.createElement('div');
        reply.dataset.auditChatMessage = '';
        reply.dataset.auditMessageId = `business-${++sequence}`;
        reply.dataset.side = 'business';
        reply.textContent = 'Yes, the August 23 AI workshop is still available for $50. Would you like to book your spot?';
        messages.append(reply);
      }, 250);
    });
  </script>
</body>
</html>
